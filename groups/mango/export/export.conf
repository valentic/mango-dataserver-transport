[DEFAULT]

[ProcessGroup]

clients:        files
label:          Export files to remote sites

[files]

command:        exportfiles.py
label:          Post files to the remote station inbound groups

pollrate:       1:00
pollrate.sync:  True

# For development/debugging

pollrate.at_start: true 
#log.level: debug
exit_on_error: true
#post.enable: false

# SQL

sql.db:                     tincan.v1-prod 
sql.base:                   psql -h %(sql.host)s -p %(sql.port)s -U %(sql.user)s %(sql.db)s

# Assumes names are /data/transport/mango/watch/export/<station>/<filegroup>/<name>
#                     1      2       3      4     5        6        7          8      

station: <path[6]>

post.newsserver:            localhost
post.newsserver.port:       1119
post.newsgroup.template:    %(news.station)s.%(station)s.inbound.%(filegroup)s   

filegroups:                 schedules updates misc flags

filegroup.*.start.path:     %(path.project.export)s
filegroup.*.match.paths:    */%(filegroup)s/*
filegroup.*.match.names:    *
filegroup.*.remove_files:   yes
filegroup.*.parse_time:     no
filegroup.*.serial_num:     yes

